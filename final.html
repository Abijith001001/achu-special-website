<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Final</title>
<style>
body{margin:0;height:100vh;background:#111;color:white;display:flex;justify-content:center;align-items:center;text-align:center;font-family:Arial;overflow:hidden}
.box{max-width:700px;z-index:2}
.f{position:absolute;animation:up 8s linear infinite;color:#ff7aa2}
@keyframes up{from{transform:translateY(100vh)}to{transform:translateY(-100px)}}
</style></head><body>
<div class="box">
<h1>❤️</h1>
<p>
No matter where life takes us,<br>
I hope you always stay happy,<br>
keep smiling,<br>
and achieve everything you dream of.<br><br>
Thank you for being with me and making my days feels good.<br><br>
<b>With love,<br>Your Chekkan ❤️</b>
</p>
</div>
<script>
for(let i=0;i<50;i++){let d=document.createElement('div');d.className='f';d.innerHTML='❤';d.style.left=Math.random()*100+'vw';d.style.fontSize=(15+Math.random()*25)+'px';d.style.animationDuration=(4+Math.random()*6)+'s';document.body.appendChild(d);}
</script>
</body></html>
