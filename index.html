<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Are You?</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#111;color:#fff;font-family:Arial}
.box{text-align:center;padding:30px}
input,button{padding:12px 16px;border-radius:10px;border:none;margin:8px}
button{cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>Who are you..? 🤔</h1>
<p>This place is only for a special person.</p>
<input id="name" placeholder="Type your name">
<br>
<button onclick="go()">Confirm</button>
<p id="msg"></p>
</div>
<script>
function go(){
 let n=document.getElementById('name').value.trim().toLowerCase();
 if(n==='achu'){
   location.href='welcome.html';
 }else{
   document.getElementById('msg').innerText="Hhh...?? I don't think this is the way I call my special person. ❤️";
 }
}
</script>
</body>
</html>
